services:
  - type: web
    name: machijikan
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    # 永続ディスク。これが無いと再デプロイ・再起動のたびにお知らせが消える。
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STAFF_PASSWORD
        sync: false
      # データの保存先を永続ディスク上にする
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
