<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>スタッフ管理 | 宮平医院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/staff.css">
</head>
<body>

  <!-- パスワード入力画面 -->
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2>スタッフ専用</h2>
      <p>パスワードを入力してください</p>
      <form id="auth-form">
        <input type="password" id="password-input" class="auth-input" placeholder="パスワード" autocomplete="current-password" required>
        <p class="auth-error" id="auth-error"></p>
        <button type="submit" class="auth-button">ログイン</button>
      </form>
    </div>
  </div>

  <!-- メイン管理画面 -->
  <main class="container" id="main-container" style="display:none;">
    <header class="staff-header">
      <h1>宮平医院 <span class="header-sub">受付管理</span></h1>
    </header>

    <!-- ステータス切り替え -->
    <div class="status-toggle" id="status-toggle">
      <button class="toggle-btn toggle-btn-open active" id="btn-open" type="button">
        <span class="toggle-icon">🟢</span>
        <span class="toggle-label">診療中</span>
      </button>
      <button class="toggle-btn toggle-btn-closed" id="btn-closed" type="button">
        <span class="toggle-icon">🔴</span>
        <span class="toggle-label">受付終了</span>
      </button>
    </div>

    <!-- 操作パネル（診療中のみ表示） -->
    <div class="controls-panel" id="controls-panel">
      <div class="current-count-card">
        <p class="count-label">現在の待ち人数</p>
        <div class="count-display">
          <span class="count-number" id="count-number">-</span>
          <span class="count-unit">名</span>
        </div>
      </div>

      <div class="controls">
        <div class="button-row">
          <button class="ctrl-btn ctrl-btn-minus" id="btn-minus" title="1名減らす">
            <span class="ctrl-btn-icon">−</span>
            <span class="ctrl-btn-label">1名減</span>
          </button>
          <button class="ctrl-btn ctrl-btn-plus" id="btn-plus" title="1名追加">
            <span class="ctrl-btn-icon">＋</span>
            <span class="ctrl-btn-label">1名追加</span>
          </button>
        </div>

        <button class="reset-btn" id="btn-reset">リセット（0名に戻す）</button>
      </div>
    </div>

    <!-- 受付終了中のメッセージ -->
    <div class="closed-panel hidden" id="closed-panel">
      <div class="closed-panel-icon">🏥</div>
      <p class="closed-panel-text">受付終了中</p>
      <p class="closed-panel-sub">患者ページには終了案内が表示されています</p>
    </div>

    <!-- 告知事項（患者ページに表示） -->
    <div class="announce-section" id="announce-section">
      <div class="announce-head">
        <span class="announce-label">📢 患者さんへのお知らせ</span>
        <span class="announce-counter" id="announce-counter">0 / 200</span>
      </div>
      <textarea id="announce-input" class="announce-input" rows="3" maxlength="200"
        placeholder="例：本日は院長が不在のため、お薬の処方のみとなります。"></textarea>
      <div class="announce-buttons">
        <button class="announce-clear-btn" id="btn-announce-clear" type="button">クリア</button>
        <button class="announce-save-btn" id="btn-announce-save" type="button">お知らせを更新</button>
      </div>
      <p class="announce-status" id="announce-status"></p>
    </div>

    <!-- お知らせ管理（ホームページに掲載される記事） -->
    <section class="news-admin" id="news-admin">
      <div class="admin-head">
        <h2 class="admin-title">ホームページのお知らせ</h2>
        <button class="btn-new" id="btn-news-new" type="button">＋ 新規作成</button>
      </div>
      <p class="admin-hint">ここで作成した内容が、ホームページの「お知らせ」に掲載されます。</p>

      <form class="news-form hidden" id="news-form">
        <p class="news-form-heading" id="news-form-heading">新しいお知らせ</p>

        <div class="field">
          <label class="field-label" for="news-title">タイトル <span class="req">必須</span></label>
          <input type="text" id="news-title" class="field-input" maxlength="100"
            placeholder="例：年末年始の休診について">
        </div>

        <div class="field">
          <label class="field-label" for="news-body">本文 <span class="req">必須</span></label>
          <textarea id="news-body" class="field-input field-textarea" rows="5" maxlength="2000"
            placeholder="患者さんにお伝えする内容を入力してください。"></textarea>
          <span class="field-counter" id="news-body-counter">0 / 2000</span>
        </div>

        <div class="field">
          <label class="field-label" for="news-category">分類</label>
          <select id="news-category" class="field-input">
            <option value="news">お知らせ</option>
            <option value="closure">休診・診療時間</option>
            <option value="vaccine">予防接種</option>
            <option value="checkup">健診</option>
          </select>
        </div>

        <label class="check-row">
          <input type="checkbox" id="news-pinned">
          <span>重要なお知らせとして一番上に固定する</span>
        </label>

        <p class="news-form-error" id="news-form-error"></p>

        <div class="form-buttons">
          <button type="button" class="btn-cancel" id="btn-news-cancel">キャンセル</button>
          <button type="submit" class="btn-save" id="btn-news-save">保存する</button>
        </div>
      </form>

      <div id="news-admin-list"></div>
    </section>

    <div class="qr-section" id="qr-section">
      <button class="qr-toggle-btn" id="btn-qr-toggle">📱 患者用QRコードを表示</button>
      <div class="qr-panel hidden" id="qr-panel">
        <p class="qr-label">患者ページのURL：</p>
        <p class="qr-url" id="qr-url"></p>
        <canvas id="qr-canvas" class="qr-canvas"></canvas>
        <p class="qr-hint">このQRコードを待合室に掲示してください</p>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">接続中...</span>
      <span class="last-updated" id="last-updated"></span>
    </div>

    <div class="footer-links">
      <a href="/" class="footer-link" target="_blank" rel="noopener">🏠 ホーム</a>
      <a href="/guide.html" class="footer-link">📖 操作ガイド</a>
      <a href="/poster.html" class="footer-link">🖨️ ポスター印刷</a>
    </div>
  </main>

  <script src="/js/staff.js"></script>
</body>
</html>
